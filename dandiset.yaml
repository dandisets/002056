description: This dataset contains 1-photon calcium imaging (UCLA miniscope, GCaMP6f)
  and local field potential recordings, both from layer 5 of the primary motor cortex
  (MOp5). Additionally, it contains DeepLabCut-tracked behavior (per-bodypart tracking
  data with likelihood values) from mice trained on a prehension task, with timestamps
  aligned across modalities within each session. It accompanies the study "Increased
  layer 5 Martinotti cell excitation reduces pyramidal cell population plasticity
  and improves learned motor execution". Chrna2 Martinotti cells were chemogenetically
  activated during training in Cre+ animals to examine their role in pyramidal cell
  tuning, assembly reconfiguration, LFP activity, and consolidation of learned motor
  skills.
